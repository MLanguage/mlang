stages:
  - build

build:
  stage: build

  variables:
    OCAML_COMPILER: "4.14.2"
#    ARTIFACTS: "artifacts/$OCAML_COMPILER"

    FF_USE_FASTZIP: "true"
    # A workaround against a bug in gitlab-runner's default
    # unzipping implementation, which partially breaks caching for the dune _build cache.
    # See https://gitlab.com/gitlab-org/gitlab-runner/-/issues/27496 for more details.

  rules:
    - exists:
        - dune-project

  image: gitlab.adullact.net:4567/dgfip/impots-nationaux-revenu-patrimoine-particuliers/mlang:latest

  artifacts:
    paths:
      - documentation
      - bin
    when: on_success

#  cache:
#    key: $OCAML_COMPILER
#    paths:
#      - _opam
#      - _build

  script:
    # Initialisation
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git submodule init ir-calcul
    - git submodule update ir-calcul
    # Installation des dépendances opam
    # Verification de l'indentation
    - opam exec -- dune build @fmt
    # Compilation
    - make build
    # Tests
    - OPTIMIZE=0 make ci_tests
    # Compilation du binaire statique
    - ([ "$CI_COMMIT_BRANCH" != "dev" ] && [ "$CI_COMMIT_BRANCH" != "master" ])
      || make build-static
    # Génération de la documentation
    - ([ "$CI_COMMIT_BRANCH" != "dev" ] && [ "$CI_COMMIT_BRANCH" != "master" ])
      || (make doc-deps && make doc)
    # Edition des chemins d'artefact
    ## Artefact documentation
    - ([ "$CI_COMMIT_BRANCH" != "dev" ] && [ "$CI_COMMIT_BRANCH" != "master" ])
      || (mkdir documentation && cp -r _build/default/full-doc/html/* documentation)
    ## Artefact binaire statique
    - ([ "$CI_COMMIT_BRANCH" != "dev" ] && [ "$CI_COMMIT_BRANCH" != "master" ])
      || (mkdir bin && cp _build/default/src/main.exe bin/mlang)
